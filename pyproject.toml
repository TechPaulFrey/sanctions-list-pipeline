[project]
name = "global-sanctions-data-platform"
version = "0.1.0"
description = "Daily ingestion, history and cross-list linking of the UN, OFAC, UK and Nigeria sanctions lists."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.13.26",
    "dagster-dbt>=0.29.26",
    "dagster-webserver>=1.13.26",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_platform"]

[dependency-groups]
dev = ["pytest", "ruff", "xmlschema", "respx"]

[tool.dagster]
module_name = "sanctions_platform.definitions"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
